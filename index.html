<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2350 年人类文明太阳周边 50 光年星图</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-label="2350 年人类文明 50 光年 3D 星图">
      <canvas id="map" aria-label="可旋转的太阳周边 50 光年三维恒星系地图"></canvas>

      <section class="panel panel-left" aria-label="地图控制">
        <button id="toggleLeft" class="panel-toggle" type="button" title="隐藏/显示控制面板">◀</button>
        <div class="panel-left-inner" id="panelLeftInner">
        <div class="mast">
          <p class="kicker">AD 2350 / 50 ly</p>
          <h1>人类文明星图</h1>
          <p class="subline">银河坐标：X+ 银心，Y+ 银河自旋方向，Z+ 北银极</p>
        </div>

        <div class="control-block">
          <label for="factionFilter">势力</label>
          <select id="factionFilter">
            <option value="all">全部势力</option>
          </select>
        </div>

        <div class="filter-grid" aria-label="星图筛选">
          <div class="control-block compact">
            <label for="searchFilter">检索</label>
            <input id="searchFilter" type="text" list="starNames" placeholder="恒星系 / 势力 / 备注" />
          </div>
          <div class="control-block compact">
            <label for="objectTypeFilter">天体类型</label>
            <select id="objectTypeFilter">
              <option value="all">全部类型</option>
            </select>
          </div>
          <div class="control-block compact">
            <label for="spectralFilter">恒星类型</label>
            <select id="spectralFilter">
              <option value="all">全部光谱</option>
            </select>
          </div>
          <div class="control-block compact">
            <label for="factionTypeFilter">势力类型</label>
            <select id="factionTypeFilter">
              <option value="all">全部类型</option>
            </select>
          </div>
          <div class="control-block compact">
            <label for="minPlanets">行星下限</label>
            <input id="minPlanets" type="number" min="0" max="12" value="0" step="1" />
          </div>
          <div class="control-block compact">
            <label for="yearSlider">时间 <span id="yearLabel">2350</span></label>
            <input id="yearSlider" type="range" min="2200" max="2402" value="2350" step="1" />
          </div>
        </div>

        <div class="control-grid">
          <button id="resetView" type="button">重置视角</button>
          <button id="topView" type="button">北银极视角</button>
          <button id="planeView" type="button">银河平面</button>
          <button id="spinToggle" type="button" aria-pressed="false">自动旋转</button>
        </div>

        <div class="switches" aria-label="图层开关">
          <label><input id="showLabels" type="checkbox" checked /> 名称</label>
          <label><input id="showTerritories" type="checkbox" checked /> 势力连线</label>
          <label><input id="showOctants" type="checkbox" checked /> 八象限</label>
          <label><input id="showQuadrantBounds" type="checkbox" /> 八象限边界</label>
          <label><input id="showOuter" type="checkbox" checked /> 25-50 光年外环</label>
          <label><input id="habitableOnly" type="checkbox" /> 只看宜居/准宜居</label>
        </div>

        <div class="control-block">
          <label for="starScale">星点尺寸</label>
          <input id="starScale" type="range" min="0.7" max="1.9" value="1.1" step="0.05" />
        </div>

        <div class="control-block">
          <label for="skyRadius">天球半径 <span id="skyRadiusLabel">15</span> ly</label>
          <input id="skyRadius" type="range" min="0" max="55" value="15" step="1" />
        </div>

        <div class="detail-field-section" aria-label="详情展示选项">
          <div class="detail-field-header">
            <span>详情展示</span>
            <button id="detailSelectAll" type="button">全选</button>
            <button id="detailSelectNone" type="button">全不选</button>
          </div>
          <div id="detailFieldControls" class="field-controls" aria-label="分类显示选择"></div>
        </div>

        <div class="agent-tools" aria-label="Agent 接口快捷操作">
          <label for="agentAction">Agent 接口</label>
          <select id="agentAction">
            <option value="none">-- 选择操作 --</option>
            <option value="single">单星操作 (Zoom/内部/最近)</option>
            <option value="distance">计算距离</option>
          </select>
          <div id="agentSingleTools" style="display: none; margin-top: 8px;">
            <input id="agentStar" type="text" list="starNames" placeholder="gj1002 / Teegarden / 李-哈特曼" />
            <div class="control-grid" style="margin-top: 8px;">
              <button id="zoomStar" type="button">Zoom 到恒星系</button>
              <button id="openSystem" type="button">打开内部结构</button>
              <button id="nearestStar" type="button">最近恒星系</button>
            </div>
          </div>
          <div id="agentDistanceTools" style="display: none; margin-top: 8px;">
            <div class="distance-row">
              <input id="distanceFrom" type="text" list="starNames" placeholder="from" />
              <input id="distanceTo" type="text" list="starNames" placeholder="to" />
            </div>
            <button id="calcDistance" type="button" style="width: 100%; margin-top: 8px;">计算距离</button>
          </div>
          <pre id="agentOutput" aria-live="polite" style="display: none;"></pre>
          <datalist id="starNames"></datalist>
        </div>

        <div class="legend" id="legend" aria-label="势力图例"></div>
        </div>
      </section>

      <section class="panel panel-right" aria-label="恒星系详情">
        <button id="toggleRight" class="panel-toggle panel-toggle-right" type="button" title="隐藏/显示详情面板">✕</button>
        <div class="detail-head">
          <p class="kicker">选中恒星系</p>
          <h2 id="detailTitle">太阳 / Sol</h2>
        </div>
        <nav id="detailTabs" class="detail-tabs" aria-label="详情横向导航"></nav>
        <div id="detailList" class="detail-list"></div>
      </section>

      <div class="hud" aria-hidden="true">
        <span><b>X+</b> 银心</span>
        <span><b>Y+</b> 银河自旋方向</span>
        <span><b>Z+</b> 北银极</span>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
